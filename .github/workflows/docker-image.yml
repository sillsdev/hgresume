name: Docker Image CI

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Build the amd64 image once and hand it to every test leg as an artifact (a multi-arch image can't
  # be loaded/run directly). The push job reuses this build's cache, so amd64 is not compiled twice.
  build:
    name: Build image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build amd64 image
        uses: docker/build-push-action@v7
        with:
          context: csharp
          file: csharp/Dockerfile
          platforms: linux/amd64
          tags: hgresume-csharp:test
          outputs: type=docker,dest=${{ runner.temp }}/hgresume-image.tar
          cache-to: type=gha,mode=max
          cache-from: type=gha

      - name: Upload image
        uses: actions/upload-artifact@v7
        with:
          name: hgresume-image
          path: ${{ runner.temp }}/hgresume-image.tar
          retention-days: 1

  # Run the integration tests against the image once per Chorus client (see ChorusClient in
  # HgResume.IntegrationTests.csproj). The HTTP-level tests don't depend on the client, so only the
  # pinned leg runs them; the other legs run just the tests that drive the real Chorus client.
  test:
    name: Integration tests (${{ matrix.client }} Chorus)
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - client: pinned
            filter: ''
          - client: latest
            filter: FullyQualifiedName~SendReceiveTests|FullyQualifiedName~VerifyHgWorking
          # Chorus this old drops the port from the repo URL, so the server has to be on port 80.
          - client: hg3
            filter: FullyQualifiedName~SendReceiveTests|FullyQualifiedName~VerifyHgWorking
            host-port: '80'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download image
        uses: actions/download-artifact@v8
        with:
          name: hgresume-image
          path: ${{ runner.temp }}

      - name: Load image
        run: docker load --input "${{ runner.temp }}/hgresume-image.tar"

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # The Mercurial 3 bundle's Linux hg is a #!/usr/bin/python2 script, and ubuntu-latest has no
      # Python 2 (same setup as LexBox's integration-test.yaml).
      - name: Set up Python 2 for Mercurial 3
        id: python
        if: matrix.client == 'hg3'
        uses: MatteoH2O1999/setup-python@v6
        with:
          python-version: '2.7.18'
          cache-build: true
          allow-build: allow

      - name: Link python2
        if: matrix.client == 'hg3'
        run: sudo ln -s "${{ steps.python.outputs.python-path }}" /usr/bin/python2

      - name: Run integration tests against the image
        working-directory: csharp
        env:
          # The test fixture drives the pre-built image itself via Testcontainers (against the
          # runner's local Docker daemon), so we skip the fixture's own build step.
          HGRESUME_IMAGE: hgresume-csharp:test
          HGRESUME_SKIP_BUILD: '1'
          HGRESUME_HOST_PORT: ${{ matrix.host-port }}
          TEST_FILTER: ${{ matrix.filter }}
        run: |
          args=(test/HgResume.IntegrationTests/HgResume.IntegrationTests.csproj
            "-p:ChorusClient=${{ matrix.client }}" --logger "console;verbosity=normal")
          if [ -n "$TEST_FILTER" ]; then args+=(--filter "$TEST_FILTER"); fi
          dotnet test "${args[@]}"

  push:
    name: Build and push multi-arch image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # A step output, not an env var: a job-wide `VERSION` env var is imported by MSBuild as the
      # $(Version) property and breaks `dotnet test` ('v<date>' is not a valid version string).
      - name: Set version tag
        id: version
        run: echo "value=v$(date --rfc-3339=date)" >> "${GITHUB_OUTPUT}"

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # For a pull request this produces the tag `pr-<number>`, so the image can be pulled and
          # tested in a real environment: `docker pull ghcr.io/<repo>:pr-<number>`.
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=raw,value=${{ steps.version.outputs.value }},enable=${{ github.event_name != 'pull_request' }}

      - name: Log in to the Container registry
        # Fork PRs get a read-only GITHUB_TOKEN; skip login/push so the job still builds without a 403.
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Multi-arch build + push. amd64 layers come from the build job's cache (no recompile); only
      # arm64 is built here. Push is gated the same way as login.
      - name: Build and push Docker image (C#)
        uses: docker/build-push-action@v7
        with:
          context: csharp
          file: csharp/Dockerfile
          push: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
